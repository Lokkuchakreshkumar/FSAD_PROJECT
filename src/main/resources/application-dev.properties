spring.config.activate.on-profile=dev

# MySQL Database Configuration (Local)
spring.datasource.url=jdbc:mysql://localhost:3306/peersphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_DATABASE_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Placeholder values to avoid startup failure
EMAIL_USERNAME=placeholder-email@example.com
EMAIL_PASSWORD=placeholder-password
GOOGLE_CLIENT_ID=YOUR_GOOGLE_CLIENT_ID
GOOGLE_CLIENT_SECRET=YOUR_GOOGLE_CLIENT_SECRET

# Disable health indicators for non-configured components
management.health.mail.enabled=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
